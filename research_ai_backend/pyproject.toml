[tool.poetry]
name = "athene-ai-backend"
version = "0.1.0"
description = "Athene AI — Multimodal 7-Agent Research Engine (FastAPI + LangGraph backend)"
authors = ["Athene AI"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
langchain = "^0.3.0"
langchain-anthropic = "^0.2.0"
langgraph = "^0.2.0"
anthropic = "^0.34.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.1"
pymupdf = "^1.24.9"
pdfplumber = "^0.11.4"
pillow = "^10.4.0"
easyocr = "^1.7.1"
opencv-python-headless = "^4.10.0.84"
openai-whisper = "^20231117"
networkx = "^3.3"
beautifulsoup4 = "^4.12.3"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
